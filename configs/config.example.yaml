# goframe 示例配置
# 所有 Secret 必须由运行环境注入，禁止提交真实密钥。
# 支持 ${VAR} 与 ${VAR:-default} 占位符展开，也支持 GOFRAME_* 环境变量覆盖。

app:
  name: goframe-app
  version: 1.0.0
  environment: development

license:
  # 企业离线许可；启用后 Strict 为 true 时无效许可会阻断启动
  enabled: false
  file: ""
  # 公钥 PEM 内容或公钥文件路径
  public_key: ""
  # 可选的离线吊销列表
  revocation_file: ""
  # 许可状态查询接口；留空表示不注册
  status_path: /license
  strict: true
  # 记录最后校验时间，用于检测系统时间回拨
  state_file: data/license/state.json
  # 显式指定机器指纹；为空时自动计算
  fingerprint: ""
  # 指纹来源优先级：uuid / hostid / disk / cpuid / mac；为空使用默认顺序
  fingerprint_sources: []
  clock_tolerance: 5m

server:
  host: 0.0.0.0
  port: 8080
  mode: release
  read_timeout: 30s
  read_header_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 30s
  max_header_bytes: 1048576
  # 只有可信反向代理地址才能提供真实客户端 IP
  trusted_proxies: []
  api_prefix: /api
  api_version: v1
  # 请求限制：方法白名单、请求体与 Query 上限
  request:
    max_body_size: 10MB
    max_query_length: 4096
    allowed_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
    require_json_body: true

trace:
  # OpenTelemetry 链路追踪，默认关闭
  enabled: false
  service_name: ""
  # OTLP 收集器地址
  endpoint: localhost:4318
  protocol: http
  insecure: true
  sample_ratio: 1.0
  timeout: 5s
  batch_timeout: 5s
  headers: {}

openapi:
  # swaggo 生成的文档；需运行 swag init 并匿名导入 docs 包
  enabled: false
  path: /swagger

database:
  # 留空表示不启用数据库；支持 mysql / postgres
  driver: ""
  dsn: ${DB_DSN}
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 30m
  slow_threshold: 500ms
  log_level: warn

redis:
  enabled: false
  addr: ${REDIS_ADDR}
  username: ""
  password: ${REDIS_PASSWORD}
  db: 0
  pool_size: 20
  key_prefix: "goframe:"

taskqueue:
  # 基于 Asynq（Redis）的分布式任务队列
  enabled: false
  # 为空时整体复用上方 redis 段的连接配置
  addr: ""
  username: ""
  password: ""
  db: 0
  # worker 并发量
  concurrency: 10
  # 队列名 -> 权重，决定各队列的消费比例；未列出的队列不会被消费
  queues:
    default: 10
    notify: 5
  # true 时严格按队列优先级消费，而非按权重轮转
  strict_priority: false
  # 优雅停机等待任务完成的最长时间
  shutdown_timeout: 8s
  # 入队任务的默认重试次数与单任务执行超时
  max_retry: 3
  task_timeout: 1m
  # Asynq 内部日志级别：debug / info / warn / error / fatal
  log_level: info

notify:
  # 统一通知；taskqueue 启用时 notify.Send 入队异步发送并自动重试，
  # 队列未启用时回退为同步直发
  enabled: false
  # 发送通道：smtp / webhook
  channel: smtp
  # 投递的队列名，必须存在于 taskqueue.queues
  queue: notify
  max_retry: 3
  smtp:
    host: ${SMTP_HOST}
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    from: noreply@example.com
    tls: false
  webhook:
    url: ${WEBHOOK_URL}
    # 配置后附加 X-Signature HMAC-SHA256 签名头
    secret: ${WEBHOOK_SECRET}
    headers: {}
    timeout: 10s

logger:
  level: info
  format: json
  # stdout / stderr / 文件路径；文件输出默认开启滚动
  output: logs/app.log
  rotation:
    enabled: true
    # 单个日志文件上限，达到上限后自动切分
    max_size: 100MB
    # 旧日志保留天数与数量
    max_age: 30
    max_backups: 10
    # 压缩旧日志为 .gz
    compress: true
    # 备份时间使用本地时区
    local_time: true

security:
  auth:
    enabled: true
    issuer: goframe
    audience: goframe-api
    # 生产环境必须配置至少 32 个字符的高强度随机值
    secret: ${JWT_SECRET}
    access_token_ttl: 30m
    refresh_token_ttl: 720h
    leeway: 30s
    password:
      algorithm: argon2id
      memory: 65536
      iterations: 3
      parallelism: 1

  rate_limit:
    enabled: true
    # 每个客户端 IP 的令牌补充速率与桶容量
    global_rate: 1000
    global_burst: 2000
    # 限流 key 数量上限，防止伪造 IP 等高基数 key 占用过多内存
    max_buckets: 100000
    fail_open: false

  csrf:
    enabled: true
    cookie_name: csrf_token
    header_name: X-CSRF-Token
    ttl: 12h
    secure: false
    secret: ${CSRF_SECRET}

  upload:
    max_size: 50MB
    scan_enabled: false
    # scan_enabled 为 true 时使用 clamd INSTREAM 扫描
    clamav:
      addr: 127.0.0.1:3310
      timeout: 30s
    allowed_extensions:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .webp
      - .pdf
      - .txt
      - .csv
      - .zip
    # 为空表示不额外限制 MIME，仅按扩展名与 Magic Number 校验
    allowed_mime_types: []
    image_max_width: 4096
    image_max_height: 4096
    image_max_pixels: 33554432
    image_quality: 85

  audit:
    enabled: true
    max_detail_size: 4KB

  encryption:
    algorithm: aes-256-gcm
    key_provider: env
    key_id: primary
    key: ${ENCRYPTION_KEY}

tls:
  # none: 由反向代理终止 TLS；file: 加载已有证书；acme: 自动申请与续期
  mode: none
  cert_file: ""
  key_file: ""
  acme:
    email: ${ACME_EMAIL}
    # 域名必须解析到本机；HTTP-01 需要 80 端口可访问，TLS-ALPN-01 需要 443
    domains: []
    # 留空使用 Let's Encrypt 生产环境；测试可填 Staging Directory URL
    directory_url: ""
    # http-01 / tls-alpn-01 / dns-01；dns-01 需通过 web.SetACMEDNSProvider 注入 DNS 厂商实现
    challenge: http-01
    cache_dir: data/acme
    http_challenge_addr: ":80"
    disable_http_challenge: false
    renew_before: 720h

spa:
  # embed 模式需通过 web.WithFileSystem 注入前端资源
  enabled: false
  mode: embed
  path: web/dist
  index: index.html

storage:
  # local / s3 / minio
  driver: local
  path: data/storage
  base_url: ""
  # s3 / minio 驱动使用以下配置
  endpoint: ""
  bucket: ""
  region: ""
  access_key: ${S3_ACCESS_KEY}
  secret_key: ${S3_SECRET_KEY}
  use_ssl: true
  secure: true

pprof:
  # 在 Web 引擎上注册 pprof 路由（github.com/gin-contrib/pprof），默认关闭
  enabled: false
  path: /debug/pprof

sysinfo:
  # 实时 CPU / 内存 / 磁盘占用接口；请求时采集，不落盘、不保留历史
  enabled: false
  path: /system
  # CPU 使用率采样窗口
  sample_interval: 300ms
  timeout: 3s

payment:
  # 在线支付网关（微信支付 APIv3 + 支付宝）；金额统一使用分，订单落库由业务负责
  enabled: false
  # 回调路由前缀，登记为 POST {notify_path}/wechat 与 {notify_path}/alipay
  notify_path: /payment/notify
  timeout: 10s
  idempotency:
    # 已处理回调标记保留时长 / 处理中互斥锁时长（复用 redis 缓存做分布式去重）
    done_ttl: 48h
    processing_ttl: 30s
  wechat:
    enabled: false
    app_id: ${WECHAT_APP_ID}
    mch_id: ${WECHAT_MCH_ID}
    serial_no: ${WECHAT_SERIAL_NO}
    # 商户 API 私钥：PEM 内容或文件路径
    private_key: ${WECHAT_PRIVATE_KEY}
    apiv3_key: ${WECHAT_APIV3_KEY}
    notify_url: https://example.com/payment/notify/wechat
  alipay:
    enabled: false
    app_id: ${ALIPAY_APP_ID}
    # 应用私钥：PEM 内容或文件路径
    private_key: ${ALIPAY_PRIVATE_KEY}
    # 普通模式填支付宝公钥；三个证书文件任一非空即启用证书模式
    public_key: ${ALIPAY_PUBLIC_KEY}
    app_cert_file: ""
    alipay_cert_file: ""
    root_cert_file: ""
    production: false
    notify_url: https://example.com/payment/notify/alipay
    return_url: https://example.com/pay/done

outbox:
  # 事务 Outbox：业务在事务内写入事件，后台 relay 投递到进程内 EventBus
  enabled: false
  interval: 1s
  batch_size: 100
  max_attempts: 10
  base_delay: 1s
  max_delay: 1m
  lease_timeout: 1m

scheduler:
  enabled: true
  job_timeout: 5m
  location: Asia/Shanghai

pool:
  # 后台任务协程池；workers=0 时按 CPU 核数自动计算
  workers: 8
  queue_size: 1024

mqtt:
  enabled: false
  brokers: []
  client_id: ""
  username: ""
  password: ${MQTT_PASSWORD}
  keep_alive: 30s
  connect_timeout: 10s
  reconnect_interval: 5s
  clean_session: false
  auto_reconnect: true
  tls:
    enabled: false
    ca_file: ""
    cert_file: ""
    key_file: ""
    server_name: ""

broker:
  # 嵌入式 MQTT Broker，为设备提供标准 MQTT 3.1/3.1.1 接入
  enabled: false
  addr: ":1883"
  # 关闭匿名时，必须通过 app.WithBrokerAuthenticator 注入鉴权器
  allow_anonymous: false
  max_packet_size: 1MB
  max_clients: 10000
  max_subscriptions: 100
  max_queued_messages: 100
  # 持久会话过期时间，从最后一次断开开始计算
  session_expiry: 24h
  write_timeout: 10s
  connect_timeout: 10s
  # QoS 1/2 未确认消息的重发间隔
  retransmit_interval: 10s
  send_queue: 256
  tls:
    # 开启后直接监听 TLS（默认端口通常为 8883）
    enabled: false
    cert_file: ""
    key_file: ""

websocket:
  enabled: false
  path: /ws
  # 为空表示只允许同源；"*" 表示允许任意来源（不建议生产使用）
  allowed_origins: []
  max_message_size: 1MB
  read_timeout: 60s
  write_timeout: 10s
  ping_interval: 30s
  send_queue: 256
  # 上行消息处理队列，队列满时关闭慢连接
  inbound_queue: 64
  # 单连接最多订阅的 topic 数
  max_topics: 100
  # 关闭匿名时，必须通过 app.WithWebSocketAuthenticator 注入鉴权函数
  allow_anonymous: false

weixin:
  # 微信公众号与小程序鉴权；AccessToken/Ticket 自动缓存与刷新
  enabled: false
  timeout: 10s
  apps:
    - name: official
      type: official
      app_id: ${WECHAT_APP_ID}
      app_secret: ${WECHAT_APP_SECRET}
      # 服务端消息校验 Token 与消息加解密密钥
      token: ${WECHAT_TOKEN}
      encoding_aes_key: ${WECHAT_AES_KEY}
      oauth_redirect: ""
      default: true
    - name: mini
      type: mini
      app_id: ${WECHAT_MINI_APP_ID}
      app_secret: ${WECHAT_MINI_APP_SECRET}
      token: ""
      encoding_aes_key: ""
      default: false
